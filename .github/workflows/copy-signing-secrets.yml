name: Copy signing secrets to WhisperLive

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy-signing-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy verified Android signing secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WHISPER_SECRETS_PAT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in GH_TOKEN KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          keyfile="$(mktemp "$RUNNER_TEMP/signing-key.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          if ! keytool -list -keystore "$keyfile" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Source keystore could not be validated"
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            printf '%s' "${!name}" | gh secret set "$name" --repo malcerz/Whisper_live --app actions
            echo "Copied $name"
          done
          echo "::notice::All four Android signing secrets copied."
